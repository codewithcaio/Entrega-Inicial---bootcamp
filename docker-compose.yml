services:
  api:
    build: .
    container_name: salafacil-api
    ports:
      - "8000:8000"
    environment:
      EXECUTION_ENVIRONMENT: docker-compose
      DATABASE_URL: sqlite:////app/data/booking.db
      BUSINESS_HOURS_START: "${BUSINESS_HOURS_START:-08:00}"
      BUSINESS_HOURS_END: "${BUSINESS_HOURS_END:-20:00}"
    volumes:
      - booking-data:/app/data
      - ./evidence:/app/evidence
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  booking-data:
